<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vernis — кабинет</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--ink:#241a1c;--wine:#7c2d3e;--rose:#f3dee1;--paper:#fff;--bg:#faf5f0;--line:#ebdedd;--muted:#7c6b6d;--gold:#b08a2e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Manrope,sans-serif}h1,h2,h3{font-family:Fraunces,serif;margin:0}.shell{max-width:1240px;margin:auto;padding:28px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:18px;box-shadow:0 12px 32px -28px #241a1c}.hidden{display:none!important}.top{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font:700 25px Fraunces,serif}.dot{color:var(--wine)}.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--wine);font-weight:700}.muted{color:var(--muted)}button,input,select{font:inherit;border-radius:10px;padding:10px 12px;border:1px solid var(--line)}button{background:var(--wine);color:#fff;border:0;font-weight:700;cursor:pointer}button.ghost{background:#fff;color:var(--wine);border:1px solid var(--line)}button.soft{background:var(--rose);color:var(--wine)}.login{width:min(100% - 32px,400px);margin:12vh auto}.login input{width:100%;margin-top:10px}.login button{margin-top:16px;width:100%}.tabs{display:flex;gap:8px;margin-top:25px;border-bottom:1px solid var(--line);padding-bottom:12px}.tabs button{background:transparent;color:var(--muted);padding:9px 13px}.tabs button.active{background:var(--rose);color:var(--wine)}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar b{margin:0 6px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;overflow:auto}.day{min-height:260px;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}.day-head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:10px}.booking{background:var(--rose);border-left:3px solid var(--wine);padding:9px;border-radius:7px;margin:7px 0;font-size:11px}.booking b{display:block;font-size:12px}.booking select{width:100%;padding:5px;margin-top:5px;background:white}.free{background:#f5faf6;color:#3f6b52;border:1px dashed #9bc4a6;width:100%;margin-top:8px}.closed{background:#fff4ef;color:#99513f;padding:10px;border-radius:8px}.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.form-grid input,.form-grid select{width:100%}.form-grid label{font-size:12px;color:var(--muted)}table{border-collapse:collapse;width:100%;min-width:650px}th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}td,th{padding:12px 8px;border-bottom:1px solid var(--line)}.table-wrap{overflow:auto}.badge{font-size:11px;border-radius:20px;padding:4px 8px;background:var(--rose);color:var(--wine)}.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.settings-grid label{display:block;color:var(--muted);font-size:12px}.settings-grid input{width:100%;margin-top:5px}@media(max-width:700px){.shell{padding:16px}.calendar{grid-template-columns:1fr}.form-grid,.settings-grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="shell"><section id="loginBox" class="panel login"><p class="eyebrow">Vernis</p><h1 style="margin-top:8px">Кабинет администратора</h1><p class="muted">Управляйте расписанием, услугами и настройками салона.</p><input id="user" autocomplete="username" placeholder="Логин"><input id="pass" autocomplete="current-password" type="password" placeholder="Пароль"><button onclick="signIn()">Войти</button><p id="error" class="muted"></p></section><section id="app" class="hidden"><header class="top"><div><div class="brand"><span class="dot">●</span> Vernis</div><p class="muted">Центр управления салоном</p></div><div><button class="ghost" onclick="backup()">Скачать бэкап</button> <button onclick="logout()">Выйти</button></div></header><nav class="tabs"><button class="active" onclick="openTab('calendar',this)">Календарь</button><button onclick="openTab('services',this)">Услуги</button><button onclick="openTab('settings',this)">Салон и локаль</button></nav>
<section id="calendar" class="tab"><div class="panel toolbar"><button class="ghost" onclick="shift(-7)">←</button><b id="range"></b><button class="ghost" onclick="shift(7)">→</button><button class="soft" onclick="view='day';load()">День</button><button class="soft" onclick="view='week';load()">Неделя</button><input id="picker" type="date" onchange="start=new Date(this.value+'T12:00:00');load()"></div><div id="calendarGrid" class="calendar"></div><div class="panel"><p class="eyebrow">Недоступные дни</p><h2>Праздник или отпуск</h2><div class="toolbar" style="margin-top:14px"><input id="closureDay" type="date"><input id="closureLabel" placeholder="Например: Новогодние каникулы"><button onclick="addClosure()">Закрыть день</button></div><div id="closures" class="muted"></div></div></section>
<section id="services" class="tab hidden"><div class="panel"><p class="eyebrow">Прайс</p><h2>Услуги</h2><div class="table-wrap"><div id="serviceList"></div></div></div><div class="panel"><p class="eyebrow">Редактор</p><h2>Добавить или изменить услугу</h2><div class="form-grid" style="margin-top:15px"><input id="sid" type="hidden"><label>Название<input id="sname" placeholder="Маникюр"></label><label>Цена<input id="sprice" type="number" min="0"></label><label>Длительность, мин<input id="sduration" type="number" min="10"></label></div><label style="display:block;margin:14px 0"><input id="sactive" type="checkbox" checked> Показывать услугу на сайте</label><button onclick="saveService()">Сохранить услугу</button></div></section>
<section id="settings" class="tab hidden"><div class="panel"><p class="eyebrow">Профиль</p><h2>Салон, локаль и часы</h2><div id="settingFields" class="settings-grid" style="margin-top:15px"></div><button style="margin-top:18px" onclick="saveSettings()">Сохранить изменения</button></div><div class="panel"><p class="eyebrow">Расписание</p><h2>Обед и перерывы</h2><div class="toolbar" style="margin-top:14px"><select id="breakDay"><option value="0">Понедельник</option><option value="1">Вторник</option><option value="2">Среда</option><option value="3">Четверг</option><option value="4">Пятница</option><option value="5">Суббота</option><option value="6">Воскресенье</option></select><input id="breakStart" type="time"><input id="breakEnd" type="time"><button onclick="addBreak()">Добавить перерыв</button></div><div id="breakList" class="muted"></div></div></section></section></main><script>
let start=new Date(),view='week',data={};start.setHours(12,0,0,0);const $=id=>document.getElementById(id),api=(url,opt={})=>fetch(url,opt).then(async r=>{const x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.detail||'Ошибка');return x}),iso=d=>d.toISOString().slice(0,10),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function signIn(){try{await api('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:$('user').value,password:$('pass').value})});$('loginBox').classList.add('hidden');$('app').classList.remove('hidden');load()}catch(e){$('error').textContent=e.message}}async function logout(){await api('/api/auth/logout',{method:'POST'});location.reload()}function openTab(id,button){document.querySelectorAll('.tab').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));button.classList.add('active')}function days(){return Array.from({length:view==='day'?1:7},(_,i)=>{let d=new Date(start);d.setDate(d.getDate()+i);return d})}async function load(){const dates=days(),end=dates.at(-1);$('picker').value=iso(start);$('range').textContent=start.toLocaleDateString(data.settings?.language||'ru-RU')+(view==='week'?' — '+end.toLocaleDateString(data.settings?.language||'ru-RU'):'' );data=await api(`/api/admin/dashboard?start=${iso(start)}&end=${iso(end)}`);renderCalendar();renderServices();renderSettings()}function shift(n){start.setDate(start.getDate()+n);load()}
function renderCalendar(){$('calendarGrid').innerHTML=days().map(d=>{const day=iso(d),books=data.bookings.filter(b=>b.day===day),closed=data.closures.find(c=>c.day===day),locale=data.settings.language||'ru-RU';let content=closed?`<p class="closed">Закрыто: ${esc(closed.label)}</p>`:books.map(b=>`<div class="booking"><b>${b.time} · ${esc(b.service)}</b>${esc(b.client_name)}<select onchange="setStatus(${b.id},this.value)">${['new','confirmed','done','cancelled'].map(s=>`<option value="${s}" ${s===b.status?'selected':''}>${s}</option>`).join('')}</select></div>`).join('')||'<p class="muted">Свободно</p>';return `<article class="day"><div class="day-head"><b>${d.toLocaleDateString(locale,{weekday:'short',day:'numeric',month:'short'})}</b><span class="badge">${books.length} записей</span></div>${content}<button class="free" onclick="newBooking('${day}')">+ Новая запись</button></article>`}).join('');$('closures').innerHTML=data.closures.map(x=>`<p>${x.day} · ${esc(x.label)} <button class="ghost" onclick="deleteClosure('${x.day}')">Открыть</button></p>`).join('')}
async function setStatus(id,status){await api('/api/admin/bookings/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});load()}function newBooking(day){const service=data.services.find(x=>x.active);const name=prompt('Имя клиента'),phone=prompt('Телефон ('+(data.settings.phone_placeholder||'')+')'),time=prompt('Время, например 14:00');if(!name||!phone||!time)return;api('/api/bookings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service_id:service.id,day,time,client_name:name,client_phone:phone,consent:true})}).then(load).catch(e=>alert(e.message))}async function addClosure(){await api('/api/admin/closures',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({day:$('closureDay').value,label:$('closureLabel').value})});load()}async function deleteClosure(day){await api('/api/admin/closures/'+day,{method:'DELETE'});load()}
function money(v){return `${v} ${data.settings.currency||''}`}function renderServices(){$('serviceList').innerHTML='<table><tr><th>Услуга</th><th>Цена</th><th>Длительность</th><th>Видимость</th><th></th></tr>'+data.services.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${money(s.price)}</td><td>${s.duration} мин</td><td>${s.active?'Видна':'Скрыта'}</td><td><button class="ghost" onclick="editService('${s.id}')">Изменить</button></td></tr>`).join('')+'</table>'}function editService(id){const s=data.services.find(x=>x.id===id);$('sid').value=s.id;$('sname').value=s.name;$('sprice').value=s.price;$('sduration').value=s.duration;$('sactive').checked=!!s.active}async function saveService(){await api('/api/admin/services',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:$('sid').value||null,name:$('sname').value,price:+$('sprice').value,duration:+$('sduration').value,active:$('sactive').checked})});$('sid').value=$('sname').value=$('sprice').value=$('sduration').value='';load()}
const labels={salon_name:'Название салона',address:'Адрес',phone:'Телефон',privacy_url:'Ссылка на политику',language:'Язык / locale (например ru-RU)',currency:'Валюта (AZN, ₸, ₽)',phone_regex:'Regex номера телефона',phone_placeholder:'Подсказка номера',monday:'Понедельник',tuesday:'Вторник',wednesday:'Среда',thursday:'Четверг',friday:'Пятница',saturday:'Суббота',sunday:'Воскресенье'};function renderSettings(){$('settingFields').innerHTML=Object.keys(labels).map(k=>`<label>${labels[k]}<input data-setting="${k}" value="${esc(data.settings[k]||'')}" placeholder="10:00-20:00 или closed"></label>`).join('');$('breakList').innerHTML=data.breaks.map(b=>`<p>${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'][b.weekday]}: ${b.start}–${b.end} <button class="ghost" onclick="deleteBreak(${b.id})">Удалить</button></p>`).join('')}async function saveSettings(){const values={};document.querySelectorAll('[data-setting]').forEach(x=>values[x.dataset.setting]=x.value);await api('/api/admin/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({values})});load()}async function addBreak(){await api('/api/admin/breaks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({weekday:+$('breakDay').value,start:$('breakStart').value,end:$('breakEnd').value})});load()}async function deleteBreak(id){await api('/api/admin/breaks/'+id,{method:'DELETE'});load()}function backup(){location='/api/admin/backup'}api('/api/auth/me').then(()=>{$('loginBox').classList.add('hidden');$('app').classList.remove('hidden');load()}).catch(()=>{});
</script></body></html>
