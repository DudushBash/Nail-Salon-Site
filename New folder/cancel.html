<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Отмена записи — Vernis</title><style>body{font:16px system-ui;background:#faf5f0;color:#241a1c;display:grid;place-items:center;min-height:90vh;margin:0}.box{max-width:430px;background:white;border:1px solid #ebdedd;border-radius:18px;padding:32px;text-align:center}button{background:#7c2d3e;color:#fff;border:0;padding:12px 20px;border-radius:8px;font:inherit;cursor:pointer}</style><body><main class="box"><h1>Ваша запись</h1><p id="info">Проверяем ссылку…</p><button id="btn" onclick="cancel()" hidden>Отменить запись</button><p id="result"></p></main><script>const token=new URLSearchParams(location.search).get('token');let item;const e=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));fetch('/api/cancel/'+encodeURIComponent(token)).then(r=>r.json().then(x=>({r,x}))).then(({r,x})=>{if(!r.ok)throw Error(x.detail);item=x;info.innerHTML=`${e(x.service)}<br><b>${e(x.day)} в ${e(x.time)}</b>`;if(x.status==='cancelled'){result.textContent='Эта запись уже отменена.'}else if(x.status==='done'){result.textContent='Эта запись уже выполнена.'}else btn.hidden=false}).catch(x=>info.textContent=x.message||'Ссылка недействительна');async function cancel(){btn.disabled=true;let r=await fetch('/api/cancel/'+encodeURIComponent(token),{method:'POST'}),x=await r.json();result.textContent=r.ok?'Запись отменена. Время снова доступно для бронирования.':x.detail;btn.hidden=true}</script>
